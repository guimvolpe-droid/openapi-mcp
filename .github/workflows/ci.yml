name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","vast","x64"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore OpenApiMcp.sln
      - run: dotnet build OpenApiMcp.sln --no-restore -c Release
      - run: dotnet test OpenApiMcp.sln --no-build -c Release --verbosity normal
